<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDView</title>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="app">
      <header id="toolbar" role="toolbar" aria-label="Main toolbar">
        <button class="tb" id="btn-new" type="button">
          <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /><path d="M12 12v6M9 15h6" /></svg>
          <span>New</span>
        </button>
        <button class="tb" id="btn-open" type="button">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H3z" /><path d="M3 10h18l-1.6 8.2a1 1 0 0 1-1 .8H5.6a1 1 0 0 1-1-.8z" /></svg>
          <span>Open</span>
        </button>
        <button class="tb" id="btn-save" type="button">
          <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" /><path d="M7 3v5h8V3M7 21v-7h10v7" /></svg>
          <span>Save</span>
        </button>

        <div class="tb-sep"></div>

        <div class="seg" role="group" aria-label="Mode">
          <button class="seg-btn" id="btn-view" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
            <span>View</span>
          </button>
          <button class="seg-btn" id="btn-edit" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" /><path d="M13.5 6.5l4 4" /></svg>
            <span>Edit</span>
          </button>
        </div>

        <div class="tb-spacer"></div>

        <button class="tb" id="btn-outline" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M8 12h12M8 18h12" /><path d="M4 12h.01M4 18h.01" /></svg>
          <span>Outline</span>
        </button>
        <button class="tb" id="btn-find" type="button">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.9-3.9" /></svg>
          <span>Find</span>
        </button>
        <button class="tb" id="btn-print" type="button">
          <svg viewBox="0 0 24 24"><path d="M7 8V3h10v5" /><path d="M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><path d="M7 14h10v7H7z" /></svg>
          <span>PDF / Print</span>
        </button>
        <button class="tb" id="btn-theme" type="button">
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <span class="theme-label">Dark</span>
        </button>
      </header>

      <div id="tabs" role="tablist" aria-label="Open files"></div>

      <div id="notice" hidden>
        <span>This file was changed by another program.</span>
        <button type="button" id="notice-reload">Reload from disk</button>
        <button type="button" id="notice-keep">Keep my version</button>
      </div>

      <main id="body">
        <aside id="outline" aria-label="Outline">
          <div class="outline-title">Outline</div>
          <nav id="outline-list"></nav>
        </aside>

        <section id="docs">
          <div id="findbar" hidden>
            <input id="find-input" type="text" placeholder="Find in document" spellcheck="false" autocomplete="off" aria-label="Find in document" />
            <span id="find-count"></span>
            <button type="button" id="find-prev" title="Previous match (Shift+Enter)" aria-label="Previous match">
              <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></svg>
            </button>
            <button type="button" id="find-next" title="Next match (Enter)" aria-label="Next match">
              <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
            </button>
            <button type="button" id="find-close" title="Close (Esc)" aria-label="Close find">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>

          <div id="empty">
            <svg class="empty-mark" viewBox="0 0 64 64" aria-hidden="true">
              <rect x="6" y="12" width="52" height="40" rx="8" />
              <path d="M16 41V23l8 9 8-9v18M41 23v17M35 34l6 7 6-7" />
            </svg>
            <h1>Open a Markdown file</h1>
            <p>Drop a file anywhere in this window, or pick one.</p>
            <div class="empty-actions">
              <button type="button" class="primary" id="empty-open">Open file</button>
              <button type="button" id="empty-new">New document</button>
            </div>
            <div class="credit">MDView is made by Dev Sharma</div>
          </div>

          <div id="drop-overlay" hidden><div>Drop to open</div></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
