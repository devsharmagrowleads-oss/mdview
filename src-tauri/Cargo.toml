[package]
name = "mdview"
version = "0.1.1"
description = "A light, offline Markdown viewer and editor"
authors = ["Dev Sharma"]
edition = "2021"

[lib]
name = "mdview_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
